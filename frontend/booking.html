<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dine-In - Booking Details</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="nav"></nav>

<div class="page-wrap">
  <div class="page-header">
    <h1>Booking Details</h1>
    <p><a href="mybookings.html" style="color:var(--text-muted);font-size:0.875rem;">Back to My Bookings</a></p>
  </div>

  <div class="alert alert-error"   id="errorMsg"></div>
  <div class="alert alert-success" id="successMsg"></div>
  <p class="loading" id="loadingMsg">Loading booking...</p>
  <div id="content"></div>
</div>

<script src="app.js"></script>
<script>
  requireUser();
  buildNav();

  const params        = new URLSearchParams(location.search);
  const bookingId     = params.get('id');
  const currentUserId = localStorage.getItem('user_id');

  if (!bookingId) showAlert(document.getElementById('errorMsg'), 'No booking ID provided.');

  async function loadBooking() {
    const errorEl   = document.getElementById('errorMsg');
    const successEl = document.getElementById('successMsg');
    const loadingEl = document.getElementById('loadingMsg');
    const content   = document.getElementById('content');
    if (!bookingId) return;

    try {
      const data = await apiFetch('/bookings/' + bookingId);
      loadingEl.textContent = '';

      const bk      = data.booking  || {};
      const members = data.members  || [];
      const live    = data.live_estimate;

      /* Booking info */
      let html = '<div class="card">' +
        '<div class="card-title">Booking #' + escHtml(bk.booking_id || bookingId) + '</div>' +
        '<div class="detail-list">' +
        '<div class="detail-row"><span class="key">Restaurant</span><span class="val">' + escHtml(bk.restaurant) + '</span></div>' +
        '<div class="detail-row"><span class="key">Host</span><span class="val">' + escHtml(bk.host) + '</span></div>' +
        '<div class="detail-row"><span class="key">Party size</span><span class="val">' + (bk.party_size || '-') + '</span></div>' +
        '<div class="detail-row"><span class="key">Status</span><span class="val">' + badge(bk.status) + '</span></div>' +
        '</div></div>';

      /* Queue status while waiting — clock times only, NO eating minutes */
      if (bk.status === 'confirmed' && live) {
        html +=
          '<div class="card">' +
          '<div class="card-title">Your Queue Status</div>' +
          '<div class="estimate-grid">' +
          '<div class="estimate-item"><div class="label">Expected seating</div><div class="value">' + escHtml(live.expected_seat_time || '-') + '</div></div>' +
          '<div class="estimate-item"><div class="label">Estimated finish</div><div class="value">' + escHtml(live.expected_finish_time || '-') + '</div></div>' +
          '<div class="estimate-item"><div class="label">Parties ahead</div><div class="value">' + (live.parties_ahead != null ? live.parties_ahead : '-') + '</div></div>' +
          '<div class="estimate-item"><div class="label">Tables free</div><div class="value">' + (live.tables_in_use != null ? (live.tables_total - live.tables_in_use) + ' free' : '-') + '</div></div>' +
          '</div></div>';
      }

      /* Seated — no numbers, just a message */
      if (bk.status === 'seated') {
        html +=
          '<div class="card">' +
          '<div class="card-title">You are Seated!</div>' +
          '<p style="color:var(--text-muted);font-size:0.9rem;">Enjoy your meal. Share your experience after you are done.</p>' +
          '</div>';
      }

      /* Completed — prompt feedback */
      if (bk.status === 'completed') {
        html +=
          '<div class="card" style="border-color:rgba(108,99,255,0.4);">' +
          '<div class="card-title">How was your meal?</div>' +
          '<p style="color:var(--text-muted);font-size:0.875rem;margin-bottom:0.75rem;">' +
          'Share your experience — it helps us give better time estimates to everyone.</p>' +
          '<a class="btn btn-primary" href="feedback.html?booking_id=' + bookingId + '">Leave feedback</a>' +
          '</div>';
      }

      /* Members */
      if (members.length > 0) {
        html += '<div class="card"><div class="card-title">Party Members</div>' +
          '<div class="table-wrap"><table><thead><tr><th>Name / Phone</th><th>Status</th></tr></thead><tbody>';
        members.forEach(function(m) {
          const display = m.name ? escHtml(m.name) : ('xxxxxx' + escHtml(m.phone_last4 || ''));
          html += '<tr><td>' + display + '</td><td>' + badge(m.invite_status) + '</td></tr>';
        });
        html += '</tbody></table></div></div>';
      }

      /* Actions */
      const isHost        = String(bk.host_user_id) === String(currentUserId);
      const showGuestActs = !isHost && bk.status === 'confirmed';

      html += '<div class="btn-row"><button type="button" class="btn btn-secondary" id="refreshBtn">Refresh</button>';
      content.innerHTML = html + '</div>';

      document.getElementById('refreshBtn').addEventListener('click', () => loadBooking());

      if (isHost && bk.status === 'confirmed') {
        const cancelBtn = document.createElement('button');
        cancelBtn.className = 'btn btn-danger';
        cancelBtn.textContent = 'Cancel Booking';
        cancelBtn.addEventListener('click', async function() {
          clearAlert(errorEl); clearAlert(successEl);
          cancelBtn.textContent = 'Cancelling...';
          try {
            await apiFetch('/bookings/' + bookingId + '/cancel', { method: 'POST' });
            showAlert(successEl, 'Booking cancelled.', 'success');
            setTimeout(function() { loadBooking(); }, 900);
          } catch(err) { showAlert(errorEl, err.message); cancelBtn.textContent = 'Cancel Booking'; }
        });
        document.querySelector('.btn-row').appendChild(cancelBtn);
      }

      if (showGuestActs) {
        ['accept', 'decline'].forEach(function(action) {
          const btn = document.createElement('button');
          btn.className = action === 'accept' ? 'btn btn-success' : 'btn btn-danger';
          btn.textContent = action === 'accept' ? 'Accept Invite' : 'Decline';
          btn.addEventListener('click', async function() {
            clearAlert(errorEl);
            try {
              await apiFetch('/bookings/' + bookingId + '/respond', { method: 'POST', body: JSON.stringify({ action: action }) });
              showAlert(successEl, action === 'accept' ? 'Invite accepted!' : 'Invite declined.', 'success');
              setTimeout(function() { loadBooking(); }, 900);
            } catch(err) { showAlert(errorEl, err.message); }
          });
          document.querySelector('.btn-row').appendChild(btn);
        });
      }

    } catch(err) {
      loadingEl.textContent = '';
      showAlert(document.getElementById('errorMsg'), err.message);
    }
  }

  loadBooking();
  setInterval(loadBooking, 30000);
</script>
</body>
</html>
