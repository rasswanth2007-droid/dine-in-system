<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dine-In – Booking Details</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <nav>
      <a href="index.html">Home</a>
      <a href="restaurants.html">Restaurants</a>
      <a href="mybookings.html">My Bookings</a>
      <a href="staff.html">Staff</a>
      <a href="stats.html">Stats</a>
    </nav>

    <h1>Booking Details</h1>

    <p id="status">Loading...</p>
    <p class="error" id="errorMsg"></p>

    <div id="content"></div>

    <div id="actions" style="margin-top:1rem;"></div>

    <div class="info">
      <button type="button" onclick="location.reload()">Refresh</button>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    requireLogin();

    const params = new URLSearchParams(location.search);
    const bookingId = params.get('id');
    const currentUserId = localStorage.getItem('user_id');

    if (!bookingId) {
      document.getElementById('errorMsg').textContent = 'No booking ID provided.';
    }

    function escHtml(str) {
      if (str == null) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    async function loadBooking() {
      const statusEl = document.getElementById('status');
      const errorEl = document.getElementById('errorMsg');
      const content = document.getElementById('content');
      const actionsEl = document.getElementById('actions');

      if (!bookingId) return;

      try {
        const data = await apiFetch('/bookings/' + bookingId);
        statusEl.textContent = '';

        const booking = data.booking || {};
        const members = data.members || [];
        const liveEstimate = data.live_estimate;
        const eatingForMin = data.eating_for_min;

        // Booking info
        let html = '<h2>Booking #' + escHtml(booking.booking_id || bookingId) + '</h2>';
        html += '<table><tbody>';
        html += '<tr><th>Restaurant</th><td>' + escHtml(booking.restaurant || booking.restaurant_name) + '</td></tr>';
        html += '<tr><th>Group type</th><td>' + escHtml(booking.group_type) + '</td></tr>';
        html += '<tr><th>Party size</th><td>' + (booking.party_size || '') + '</td></tr>';
        html += '<tr><th>Status</th><td>' + escHtml(booking.status) + '</td></tr>';
        html += '</tbody></table>';

        // Member list
        if (members.length > 0) {
          html += '<h3>Members</h3>';
          html += '<table><thead><tr><th>Name / Phone</th><th>Invite Status</th></tr></thead><tbody>';
          members.forEach(function(m) {
            const display = m.name ? escHtml(m.name) : ('xxxxxx' + escHtml(m.phone_last4 || ''));
            html += '<tr><td>' + display + '</td><td>' + escHtml(m.invite_status) + '</td></tr>';
          });
          html += '</tbody></table>';
        }

        // Live estimate while confirmed
        if (booking.status === 'confirmed' && liveEstimate) {
          html += '<h3>Live Estimate</h3>';
          html += '<table><tbody>';
          if (liveEstimate.wait_min) {
            html += '<tr><th>Wait range</th><td>' + liveEstimate.wait_min.p10 + '–' + liveEstimate.wait_min.p90 + ' min</td></tr>';
          }
          html += '<tr><th>Expected seat time</th><td>' + escHtml(liveEstimate.expected_seat_time) + '</td></tr>';
          html += '<tr><th>Expected finish time</th><td>' + escHtml(liveEstimate.expected_finish_time) + '</td></tr>';
          if (liveEstimate.parties_ahead != null) {
            html += '<tr><th>Parties ahead</th><td>' + liveEstimate.parties_ahead + '</td></tr>';
          }
          html += '</tbody></table>';
        }

        // Eating for X minutes while seated
        if (booking.status === 'seated' && eatingForMin != null) {
          html += '<p class="info"><strong>Eating for:</strong> ' + eatingForMin + ' minutes</p>';
        }

        content.innerHTML = html;

        // Actions
        actionsEl.innerHTML = '';
        const isHost = booking.host_id != null && String(booking.host_id) === String(currentUserId);

        // Cancel button for host
        if (isHost && (booking.status === 'confirmed' || booking.status === 'pending')) {
          const cancelBtn = document.createElement('button');
          cancelBtn.type = 'button';
          cancelBtn.textContent = 'Cancel booking';
          cancelBtn.addEventListener('click', async function() {
            errorEl.textContent = '';
            try {
              await apiFetch('/bookings/' + bookingId + '/cancel', { method: 'POST' });
              location.reload();
            } catch (err) {
              errorEl.textContent = err.message;
            }
          });
          actionsEl.appendChild(cancelBtn);
          actionsEl.appendChild(document.createElement('br'));
        }

        // Accept/Decline for non-host guests when status is pending or confirmed
        if (!isHost && (booking.status === 'confirmed' || booking.status === 'pending')) {
          const acceptBtn = document.createElement('button');
          acceptBtn.type = 'button';
          acceptBtn.textContent = 'Accept invite';
          acceptBtn.style.marginRight = '0.5rem';
          acceptBtn.addEventListener('click', async function() {
            errorEl.textContent = '';
            try {
              await apiFetch('/bookings/' + bookingId + '/respond', {
                method: 'POST',
                body: JSON.stringify({ action: 'accept' })
              });
              location.reload();
            } catch (err) {
              errorEl.textContent = err.message;
            }
          });

          const declineBtn = document.createElement('button');
          declineBtn.type = 'button';
          declineBtn.textContent = 'Decline invite';
          declineBtn.addEventListener('click', async function() {
            errorEl.textContent = '';
            try {
              await apiFetch('/bookings/' + bookingId + '/respond', {
                method: 'POST',
                body: JSON.stringify({ action: 'decline' })
              });
              location.reload();
            } catch (err) {
              errorEl.textContent = err.message;
            }
          });

          actionsEl.appendChild(acceptBtn);
          actionsEl.appendChild(declineBtn);
        }

      } catch (err) {
        statusEl.textContent = '';
        errorEl.textContent = err.message;
      }
    }

    loadBooking();

    // Auto-refresh every 30 seconds
    setInterval(function() { location.reload(); }, 30000);
  </script>
</body>
</html>
