<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dine-In – Staff</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="nav"></nav>
<div class="page-wrap">
  <div class="page-header">
    <h1>Staff / Hotel Access</h1>
    <p>Please sign in with the Hotel role to access the dashboard.</p>
  </div>
  <div class="card" style="max-width:420px; text-align:center; padding:2rem;">
    <p style="color:var(--text-muted); margin-bottom:1.25rem;">
      The staff panel has moved. Hotel accounts can manage queues from the Hotel Dashboard.
    </p>
    <a href="index.html" class="btn btn-primary">Go to Sign In →</a>
  </div>
</div>
<script src="app.js"></script>
<script>
  buildNav();
  /* If already logged in as hotel, redirect directly */
  if (localStorage.getItem('role') === 'hotel' && localStorage.getItem('staff_key')) {
    window.location.href = 'hotel.html';
  }
</script>
</body>
</html>
