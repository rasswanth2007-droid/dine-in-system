<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dine-In – Book a Table</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .phone-row { display: flex; gap: 0.5rem; align-items: center; margin-bottom: 0.5rem; }
    .phone-row input {
      flex: 1; background: var(--surface2); border: 1px solid var(--border);
      border-radius: var(--radius-sm); color: var(--text);
      padding: 0.55rem 0.875rem; font-size: 0.9rem; font-family: inherit; outline: none;
    }
    .phone-row input:focus { border-color: var(--accent); }
    .phone-row .remove-btn {
      background: none; border: none; color: var(--red);
      font-size: 1.1rem; cursor: pointer; padding: 0 0.25rem;
    }
    .section-divider { border: none; border-top: 1px solid var(--border); margin: 1.25rem 0; }
    .estimate-box {
      background: var(--surface2); border-radius: var(--radius-sm);
      border: 1px solid var(--border); padding: 1rem 1.25rem; margin-top: 0.75rem;
    }
    .est-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 0.4rem 0; border-bottom: 1px solid var(--border); font-size: 0.9rem;
    }
    .est-row:last-child { border-bottom: none; }
    .est-row .est-key { color: var(--text-muted); }
    .est-row .est-val { font-weight: 600; }
  </style>
</head>
<body>
<nav class="nav"></nav>

<div class="page-wrap">
  <div class="page-header">
    <h1 id="pageTitle">Book a Table</h1>
    <p id="pageSubtitle">Fill in the details below</p>
  </div>

  <div class="alert alert-error" id="errorMsg"></div>

  <div class="card">

    <div class="form-group" style="max-width:200px;">
      <label for="partySize">How many people? (including you)</label>
      <input type="number" id="partySize" min="1" max="30" value="2">
    </div>

    <hr class="section-divider" id="membersDivider" style="display:none;">

    <div id="membersSection" style="display:none;">
      <div style="font-size:0.875rem; font-weight:600; margin-bottom:0.5rem;">Add members phone numbers</div>
      <p style="font-size:0.8rem; color:var(--text-muted); margin-bottom:0.75rem;">
        Members who also use the app will see this booking.
      </p>
      <div id="phoneInputs"></div>
      <div style="display:flex; gap:0.5rem; margin-top:0.5rem; flex-wrap:wrap;">
        <button type="button" class="btn btn-secondary btn-sm" id="addFriendBtn">+ Add phone number</button>
        <button type="button" class="btn btn-secondary btn-sm" id="pickContactsBtn" style="display:none;">Pick from contacts</button>
      </div>
    </div>

    <hr class="section-divider">

    <div>
      <button type="button" class="btn btn-secondary" id="checkEstimateBtn">Get Estimate</button>
      <div id="estimateResult"></div>
    </div>

    <hr class="section-divider">

    <button type="button" class="btn btn-primary" id="confirmBtn">Confirm Booking</button>

  </div>
</div>

<script src="app.js"></script>
<script>
  requireUser();
  buildNav();

  const params       = new URLSearchParams(location.search);
  const restaurantId = params.get('restaurant_id');
  if (!restaurantId) showAlert(document.getElementById('errorMsg'), 'No restaurant selected. Go back and pick one.');

  apiFetch('/restaurants').then(data => {
    const r = data.find(x => String(x.restaurant_id) === String(restaurantId));
    if (r) {
      document.getElementById('pageTitle').textContent    = 'Book at ' + r.name;
      document.getElementById('pageSubtitle').textContent = r.type.charAt(0).toUpperCase() + r.type.slice(1) + ' - ' + r.city + (r.area ? ', ' + r.area : '');
    }
  }).catch(() => {});

  if (navigator.contacts && navigator.contacts.select) {
    document.getElementById('pickContactsBtn').style.display = '';
  }

  function getGroupType()  { return 'friends'; }
  function getPartySize()  { return Math.max(1, parseInt(document.getElementById('partySize').value, 10) || 1); }
  function getMemberPhones() {
    return Array.from(document.querySelectorAll('#phoneInputs input[type="tel"]'))
      .map(i => i.value.trim()).filter(Boolean);
  }

  function addPhoneInput(value) {
    const container  = document.getElementById('phoneInputs');
    const maxFriends = getPartySize() - 1;
    if (container.querySelectorAll('.phone-row').length >= maxFriends) return;
    const row = document.createElement('div');
    row.className = 'phone-row';
    const inp = document.createElement('input');
    inp.type = 'tel'; inp.placeholder = 'Phone number';
    if (value) inp.value = value;
    const rm = document.createElement('button');
    rm.className = 'remove-btn'; rm.type = 'button'; rm.textContent = 'x';
    rm.addEventListener('click', () => { row.remove(); syncUI(); });
    row.appendChild(inp); row.appendChild(rm);
    container.appendChild(row);
    syncUI();
  }

  function syncUI() {
    const maxFriends = getPartySize() - 1;
    const current    = document.querySelectorAll('#phoneInputs .phone-row').length;
    const show       = maxFriends > 0;
    document.getElementById('membersSection').style.display = show ? '' : 'none';
    document.getElementById('membersDivider').style.display = show ? '' : 'none';
    document.getElementById('addFriendBtn').style.display   = (show && current < maxFriends) ? '' : 'none';
  }

  document.getElementById('partySize').addEventListener('input', () => {
    const maxFriends = getPartySize() - 1;
    document.querySelectorAll('#phoneInputs .phone-row').forEach((r, i) => { if (i >= maxFriends) r.remove(); });
    syncUI();
  });

  document.getElementById('addFriendBtn').addEventListener('click', () => addPhoneInput(''));
  document.getElementById('pickContactsBtn').addEventListener('click', async () => {
    try {
      const contacts = await navigator.contacts.select(['tel'], { multiple: true });
      document.getElementById('phoneInputs').innerHTML = '';
      contacts.forEach(c => { if (c.tel && c.tel[0]) addPhoneInput(c.tel[0]); });
      syncUI();
    } catch(err) {
      showAlert(document.getElementById('errorMsg'), 'Could not pick contacts: ' + err.message);
    }
  });

  document.getElementById('checkEstimateBtn').addEventListener('click', async () => {
    const errorEl  = document.getElementById('errorMsg');
    const resultEl = document.getElementById('estimateResult');
    clearAlert(errorEl);
    if (!restaurantId) { showAlert(errorEl, 'No restaurant selected.'); return; }
    resultEl.innerHTML = '<p class="loading" style="margin-top:0.75rem;">Calculating...</p>';
    try {
      const d = await apiFetch('/predict?restaurant_id=' + restaurantId + '&party_size=' + getPartySize() + '&group_type=' + getGroupType());
      resultEl.innerHTML =
        '<div class="estimate-box">' +
        '<div class="est-row"><span class="est-key">Expected seating time</span><span class="est-val">' + escHtml(d.expected_seat_time || '-') + '</span></div>' +
        '<div class="est-row"><span class="est-key">Estimated finish time</span><span class="est-val">' + escHtml(d.expected_finish_time || '-') + '</span></div>' +
        '<div class="est-row"><span class="est-key">Parties ahead of you</span><span class="est-val">' + (d.parties_ahead != null ? d.parties_ahead : '-') + '</span></div>' +
        '</div>';
    } catch(err) {
      resultEl.innerHTML = '';
      showAlert(errorEl, err.message);
    }
  });

  document.getElementById('confirmBtn').addEventListener('click', async () => {
    const errorEl = document.getElementById('errorMsg');
    clearAlert(errorEl);
    if (!restaurantId) { showAlert(errorEl, 'No restaurant selected.'); return; }
    const btn = document.getElementById('confirmBtn');
    btn.textContent = 'Booking...';
    try {
      const data = await apiFetch('/bookings', {
        method: 'POST',
        body: JSON.stringify({
          restaurant_id: parseInt(restaurantId),
          group_type:    getGroupType(),
          party_size:    getPartySize(),
          members:       getMemberPhones()
        })
      });
      window.location.href = 'booking.html?id=' + data.booking_id;
    } catch(err) {
      showAlert(errorEl, err.message);
      btn.textContent = 'Confirm Booking';
    }
  });

  syncUI();
</script>
</body>
</html>
