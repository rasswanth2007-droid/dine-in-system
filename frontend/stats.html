<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dine-In – Stats</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="nav"></nav>

<div class="page-wrap">
  <div class="page-header">
    <h1>Model Statistics</h1>
    <p>Prediction accuracy based on real completed visits</p>
  </div>

  <div class="alert alert-error" id="errorMsg"></div>
  <p class="loading" id="loadingMsg">Loading stats...</p>
  <div id="content"></div>
</div>

<script src="app.js"></script>
<script>
  buildNav();
  const METRICS = [
    { key: 'real_visits',             label: 'Real Visits',               icon: '📊', desc: 'Number of real (non-synthetic) completed visits used to measure accuracy.' },
    { key: 'wait_mae_min',            label: 'Wait MAE',                  icon: '⏱',  desc: 'Mean absolute error of wait time predictions in minutes. Lower is better.' },
    { key: 'wait_baseline_mae_min',   label: 'Wait Baseline MAE',         icon: '📏',  desc: 'Baseline MAE using a simple average — compare against Wait MAE to see improvement.' },
    { key: 'wait_interval_coverage',  label: 'Wait Interval Coverage',    icon: '🎯',  desc: 'Fraction of times the actual wait fell within the predicted p10–p90 range.' },
    { key: 'eat_mae_min',             label: 'Eat Duration MAE',          icon: '🍽',  desc: 'Mean absolute error of eating duration predictions in minutes.' },
    { key: 'training_rows',           label: 'Training Rows',             icon: '🤖',  desc: 'Total visits (including synthetic) used to train the current model.' },
  ];

  async function load() {
    const errorEl = document.getElementById('errorMsg');
    const loadingEl = document.getElementById('loadingMsg');
    const content = document.getElementById('content');
    try {
      const data = await apiFetch('/stats');
      loadingEl.textContent = '';

      if (data.note) {
        content.innerHTML = `<div class="card" style="color:var(--text-muted);">${escHtml(data.note)}</div>`;
        return;
      }

      let html = '<div class="stat-grid">';
      METRICS.forEach(m => {
        const val = data[m.key] != null ? data[m.key] : '—';
        html += `<div class="stat-card">
          <div style="font-size:1.5rem;">${m.icon}</div>
          <div class="stat-value">${val}</div>
          <div class="stat-label">${m.label}</div>
          <div class="stat-desc">${m.desc}</div>
        </div>`;
      });
      html += '</div>';
      content.innerHTML = html;
    } catch (err) {
      loadingEl.textContent = '';
      showAlert(errorEl, err.message);
    }
  }

  load();
</script>
</body>
</html>
