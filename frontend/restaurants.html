<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dine-In – Restaurants</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="nav"></nav>

<div class="page-wrap">
  <div class="page-header">
    <h1>Restaurants</h1>
    <p>Pick a spot and book your table</p>
  </div>

  <div class="alert alert-error" id="errorMsg"></div>
  <p class="loading" id="loadingMsg">Loading restaurants...</p>

  <div id="content"></div>
</div>

<script src="app.js"></script>
<script>
  requireUser();
  buildNav();

  const TYPE_ICON = { mandhi:'🍖', franchise:'🍔', finedine:'🍷', cafe:'☕' };

  async function load() {
    const errorEl = document.getElementById('errorMsg');
    const loadingEl = document.getElementById('loadingMsg');
    const content = document.getElementById('content');
    try {
      const data = await apiFetch('/restaurants');
      loadingEl.textContent = '';
      if (!data || data.length === 0) { loadingEl.textContent = 'No restaurants found.'; return; }

      let html = '<div class="table-wrap"><table><thead><tr>' +
        '<th>Restaurant</th><th>Type</th><th>City / Area</th>' +
        '<th>Waiting</th><th>Seated</th><th></th>' +
        '</tr></thead><tbody>';

      data.forEach(r => {
        const icon = TYPE_ICON[r.type] || '🍽';
        html += `<tr>
          <td><strong>${escHtml(r.name)}</strong></td>
          <td>${icon} ${escHtml(r.type)}</td>
          <td>${escHtml(r.city)}${r.area ? ', ' + escHtml(r.area) : ''}</td>
          <td>${r.waiting || 0}</td>
          <td>${r.seated_now || 0}</td>
          <td><a class="btn btn-secondary btn-sm" href="book.html?restaurant_id=${r.restaurant_id}">Book →</a></td>
        </tr>`;
      });

      html += '</tbody></table></div>';
      content.innerHTML = html;
    } catch (err) {
      loadingEl.textContent = '';
      showAlert(errorEl, err.message);
    }
  }

  load();
</script>
</body>
</html>
