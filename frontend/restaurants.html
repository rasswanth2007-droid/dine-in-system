<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dine-In – Restaurants</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <nav>
      <a href="index.html">Home</a>
      <a href="restaurants.html">Restaurants</a>
      <a href="mybookings.html">My Bookings</a>
      <a href="staff.html">Staff</a>
      <a href="stats.html">Stats</a>
    </nav>

    <h1>Restaurants</h1>

    <p id="status">Loading...</p>
    <p class="error" id="errorMsg"></p>

    <table id="restaurantTable" style="display:none;">
      <thead>
        <tr>
          <th>Name</th>
          <th>Type</th>
          <th>City</th>
          <th>Area</th>
          <th>Waiting</th>
          <th>Seated</th>
          <th>Book</th>
        </tr>
      </thead>
      <tbody id="restaurantBody"></tbody>
    </table>
  </div>

  <script src="app.js"></script>
  <script>
    requireLogin();

    async function loadRestaurants() {
      const statusEl = document.getElementById('status');
      const errorEl = document.getElementById('errorMsg');
      const table = document.getElementById('restaurantTable');
      const tbody = document.getElementById('restaurantBody');

      try {
        const data = await apiFetch('/restaurants');
        statusEl.textContent = '';
        if (!data || data.length === 0) {
          statusEl.textContent = 'No restaurants found.';
          return;
        }
        tbody.innerHTML = '';
        data.forEach(function(r) {
          const tr = document.createElement('tr');
          tr.innerHTML =
            '<td>' + escHtml(r.name) + '</td>' +
            '<td>' + escHtml(r.type) + '</td>' +
            '<td>' + escHtml(r.city) + '</td>' +
            '<td>' + escHtml(r.area) + '</td>' +
            '<td>' + (r.waiting || 0) + '</td>' +
            '<td>' + (r.seated_now || 0) + '</td>' +
            '<td><a href="book.html?restaurant_id=' + r.restaurant_id + '">Book</a></td>';
          tbody.appendChild(tr);
        });
        table.style.display = '';
      } catch (err) {
        statusEl.textContent = '';
        errorEl.textContent = err.message;
      }
    }

    function escHtml(str) {
      if (str == null) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    loadRestaurants();
  </script>
</body>
</html>
